name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install SketchUp converter
        run: npm install --no-save --package-lock=false openskp@1.7.0 @gltf-transform/cli@4.5.1 sharp
      - name: Convert Archade classroom when source is available
        run: |
          if [ -s source-assets/archade/archade-classroom.skp ]; then
            npm run convert:archade
          else
            echo "Optimizing the checked-in Archade classroom GLB."
            npm run optimize:runtime
          fi
      - name: Verify runtime collision grid
        run: npm run test:collision
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Store optimized runtime assets and remove raw source file
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/assets/environment/archade/classroom.glb public/assets/environment/archade/collision.json
          if [ -f source-assets/archade/archade-classroom.skp ]; then git rm -f source-assets/archade/archade-classroom.skp; fi
          if [ -f .gitattributes ]; then git rm -f .gitattributes; fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Store optimized Archade game assets"
            git push origin HEAD:main
          fi

  # Feature branches run the production build but never replace the live Pages site.
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
